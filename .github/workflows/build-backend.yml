# Build and publish the backend image to GHCR.
#
# IMPORTANT: build context = repo root, not backend/. The Dockerfile needs
# both `backend/` and `libs/config-loader/` because pyproject.toml has
# tool.uv.sources::acmg-config-loader = { path = "../libs/config-loader" }.

name: build-backend

on:
  push:
    branches: [dev, master, staging, "release/**"]
    paths:
      - "backend/**"
      - "libs/**"
      - ".github/workflows/build-backend.yml"
  pull_request:
    branches: [dev, master]
    paths:
      - "backend/**"
      - "libs/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lingua-seeker-backend

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Rust + maturin builds eat disk. Default ubuntu-latest ships ~15GB
      # of preinstalled SDKs we don't need; reclaim them.
      - name: Free runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          df -h

       # ── Pre-build Python + Rust artefacts ──────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libssl-dev pkg-config
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5"
          enable-cache: true

      - name: Build Python + Rust artefacts
        working-directory: backend
        env:
          # Override local devpi proxy — CI talks directly to PyPI.
          UV_INDEX_URL: https://pypi.org/simple/
        run: |
          set -eux

          # Build Rust crates + install all Python deps (editable).
          # maturin builds the crate wheels and installs them into .venv.
          uv sync --no-dev --frozen

          # Package site-packages (exclude __pycache__).
          mkdir -p ../docker-artifacts
          tar czf ../docker-artifacts/site-packages.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' --dereference \
            -C .venv/lib/python3.12/site-packages .

          # Package console scripts with shebangs rewritten to /opt/venv.
          tmp=$(mktemp -d)
          cp -P .venv/bin/* "$tmp"/ 2>/dev/null || true
          rm -f "$tmp"/python* 2>/dev/null || true
          sed -i "s|$(pwd)/.venv/bin/python3|/opt/venv/bin/python3|g" "$tmp"/* 2>/dev/null || true
          tar czf ../docker-artifacts/venv-bin.tar.gz -C "$tmp" . 2>/dev/null || true
          rm -rf "$tmp"

          df -h

      # ── Docker build & push ────────────────────────────────────────
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false
