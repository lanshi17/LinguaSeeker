[project]
name = "rett-benchmark-annotation"
version = "0.1.0"
description = "Rett syndrome benchmark annotation tool with AI-assisted generation and human review"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.0",
    "pymupdf>=1.27.2",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
