# ============================================================================
# Staging — FastAPI + Postgres + Redis
# ============================================================================
# Mirrors production structure for pre-release validation.
#
# From the repo root:
#   docker compose -f deploy/compose/staging/docker-compose.yml \
#                  --env-file deploy/compose/staging/.env \
#                  pull
#   docker compose -f deploy/compose/staging/docker-compose.yml \
#                  --env-file deploy/compose/staging/.env \
#                  up -d
#
# Required env vars (set in .env or export):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY, CORS_ORIGINS,
#   EMBEDDING_BASE_URL, RERANK_BASE_URL,
#   FAST_LLM_BASE_URL, REASONING_LLM_BASE_URL
# ============================================================================
services:
  backend:
    image: ${BACKEND_IMAGE:-docker.io/[redacted-user]47/lingua-seeker-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_KEY: ${API_KEY}
      # -- Database (staging) --
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: staging_lingua_seeker
      POSTGRES_USER: lingua_seeker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: lingua_seeker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # -- Neo4j --
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # -- Inference / LLM endpoints (point at GPU host) --
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_STYLE: ${EMBEDDING_API_STYLE:-openai}
      RERANK_BASE_URL: ${RERANK_BASE_URL}
      RERANK_API_STYLE: ${RERANK_API_STYLE:-openai}
      FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL}
      REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_downloads:/app/downloads
      - backend_output:/app/output
      - ./config/staging.yaml:/app/config/environments/staging.yaml:ro
      - ./config/vault/staging.yaml:/app/config/vault/staging.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: staging_lingua_seeker
      POSTGRES_USER: lingua_seeker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua_seeker -d staging_lingua_seeker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/staging_lingua_seeker}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7474/dbms/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  backend_logs:
  backend_data:
  backend_downloads:
  backend_output:
