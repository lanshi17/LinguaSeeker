[project]
name = "acmg-lingua-backend"
version = "0.1.0"
description = "ACMG Lingua backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx[socks]>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "maturin>=1.13.1",
    "requests[socks]>=2.33.1",
    "pysocks>=1.7.1",
    "torch>=2.11.0",
    "crawl4ai>=0.8.6",
    "selectolax>=0.4.8",
    "loguru>=0.7.0",
    "mineru_vl_utils",
    "tokenizers>=0.22.0,<=0.23.0",
    "rust-io",
    "pymupdf>=1.27.2.3",
    "lingua-language-detector>=2.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "langsmith>=0.8.3",
    "socks>=0",
    "pgvector>=0.4.2",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.uv]
# 设置默认源（优先级最高）
index-url = "http://127.0.0.1:3141/root/pypi/+simple/"

# 配置所有镜像源（按优先级排序）
[[tool.uv.index]]
name = "local"
url = "http://127.0.0.1:3141/root/pypi/+simple/"
default = true  # 默认源，必须设置一个

[[tool.uv.index]]
name = "tuna"  # 清华源（国内最快）
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources]
rust-io = { path = "libs/rust-io", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (model-server VLM)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
