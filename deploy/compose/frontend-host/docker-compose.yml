# ============================================================================
# Frontend host — single container: nginx serves the built SPA and reverse-
# proxies /api/v1 + /health to the backend host across the network.
#
# From the repo root:
#
#   docker compose -f deploy/compose/frontend-host/docker-compose.yml \
#                  --env-file deploy/compose/frontend-host/.env \
#                  up -d --build
#
# For TLS, front this with a system nginx or Caddy on the host, or extend
# the image with certbot. Keeping TLS termination outside the container
# lets you renew certs without rebuilding the image.
# ============================================================================
services:
  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      args:
        # SPA mount path baked into the bundle (Vite base). Empty = root.
        # The built index.html references /<base>/assets/... and API/health
        # URLs derive from import.meta.env.BASE_URL. Must match runtime BASE_PATH.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: ${FRONTEND_IMAGE:-ghcr.io/[redacted-user]/lingua-seeker-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      # Where to reach the backend *on the other server*. MUST be routable
      # from this host, e.g. https://furong.genemed.tech or http://10.0.0.20:8000
      BACKEND_URL: ${BACKEND_URL}
      # Shared secret injected into proxied requests as X-API-Key.
      # The browser never sees this value.
      API_KEY: ${API_KEY}
      FRONTEND_MAX_BODY: ${FRONTEND_MAX_BODY:-200m}
      # Runtime SPA mount path (nginx location prefixes). Must match the
      # build-time VITE_BASE_PATH. Empty = root; /linguaseeker = subpath.
      BASE_PATH: ${BASE_PATH:-${VITE_BASE_PATH:-/}}
    healthcheck:
      # Hits the local nginx; nginx then proxies <BASE_PATH>/health to backend.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost${BASE_PATH:-/health}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
