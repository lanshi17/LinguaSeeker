[project]
name = "05-multi-acmg-mineru-demo"
version = "2.1.0"
description = "Multilingual ACMG-PS3 Evidence Collection Platform with MinerU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "requests>=2.32.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # LangChain ecosystem
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.1",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langsmith>=0.1.0",
    # PDF processing
    "pdf2image>=1.17.0",
    "PyPDF2>=3.0.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    # Language detection
    "langdetect>=1.0.9",
    # Vector databases
    "qdrant-client>=1.7.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Graph database
    "neo4j>=5.0.0",
    # Storage
    "minio>=7.1.0",
    # Utilities
    "tqdm>=4.65.0",
    "beautifulsoup4>=4.12.0",
    "mineru-kie-sdk>=0.1.1",
    "mineru>=2.7.2",
    "fasttext>=0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.version]
path = "src/__init__.py"
