[project]
name = "cross-evidence-backend"
version = "0.1.0"
description = "Variant classification and evidence interpretation platform"
requires-python = ">=3.12"

dependencies = [
    "acmg-config-loader",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx[socks]>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "maturin>=1.13.1",
    "requests[socks]>=2.33.1",
    "pysocks>=1.7.1",
    "torch>=2.11.0",
    "loguru>=0.7.0",
    "mineru_vl_utils",
    "tokenizers>=0.22.0,<=0.23.0",
    "rust-io",
    "pymupdf>=1.27.2.3",
    "lingua-language-detector>=2.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "langsmith>=0.8.3",
    "pgvector>=0.4.2",
    "aiofiles>=25.1.0",
    "pillow>=10.0.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0.0",
    "firecrawl-py>=4.28.2",
    "matplotlib>=3.10.9",
    "weasyprint>=69.0",
    "markdown>=3.10.2",
    "fpdf2>=2.8.7",
    "pyjstage2>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "copier>=9.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]


[tool.uv]
index-url = "http://127.0.0.1:3141/root/pypi/+simple/"

[[tool.uv.index]]
name = "local"
url = "http://127.0.0.1:3141/root/pypi/+simple/"
default = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"


[tool.uv.sources]
acmg-config-loader = { path = "../libs/config-loader", editable = true }
rust-io = { path = "libs/rust-io", editable = true }

[tool.pytest.ini_options]
pythonpath = [".."]
markers = [
    "integration: tests that require external services (model-server VLM)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "copier>=9.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
