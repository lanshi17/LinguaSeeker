version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:13-alpine
    container_name: mdecp_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mdecp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - mdecp_network

  # Redis缓存
  redis:
    image: redis:6-alpine
    container_name: mdecp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mdecp_network

  # 后端API服务
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: mdecp_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://admin:password@postgres:5432/mdecp_dev
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - mdecp_network

  # 前端Web应用
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: mdecp_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:3000
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mdecp_network

  # 移动端开发服务
  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile.dev
    container_name: mdecp_mobile
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - ./apps/mobile:/app
    networks:
      - mdecp_network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: mdecp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - mdecp_network

networks:
  mdecp_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: