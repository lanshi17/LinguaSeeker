# ============================================================================
# Lingua Seeker Production Inventory
# ============================================================================
# Hostnames and connection details for production environment.
# Sensitive vars (passwords, tokens) go in group_vars/vault.yml (ansible-vault encrypted)
# ============================================================================

all:
  children:
    web:
      hosts:
        web-01:
          ansible_host: "203.0.113.10"              # Replace with actual IP
          ansible_port: 22
    app:
      hosts:
        app-01:
          ansible_host: "203.0.113.20"              # Replace with actual IP
          ansible_port: 22
    db:
      hosts:
        db-01:
          ansible_host: "203.0.113.30"              # Replace with actual IP
          ansible_port: 22

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    # Project paths on remote hosts
    project_root: /opt/lingua-seeker
    backend_root: "{{ project_root }}/backend"
    frontend_root: "{{ project_root }}/frontend"
    deploy_env: production
