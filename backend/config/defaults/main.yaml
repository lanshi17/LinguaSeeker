# ============================================================================
# Lingua Seeker Backend — Default Configuration Variables
# ============================================================================
# Base structural defaults for all environments. Safe to commit.
# Override in environments/<env>.yaml and vault/<env>.yaml
#
# Loading order (lowest to highest priority):
#   1. defaults/main.yaml          (this file)
#   2. environments/<env>.yaml     (environment-specific structural config)
#   3. vault/<env>.yaml            (secrets: API keys, passwords)
#   4. Environment variables       (highest priority, override all)
#
# Field naming convention:
#   - Nested fields (e.g. fast_llm.model) flatten to FAST_LLM_MODEL
#   - Top-level fields (e.g. cors_origins) flatten to CORS_ORIGINS
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
cors_origins: "http://localhost:3000,http://127.0.0.1:3000"
environment: "development"
debug: false

# ── Fast LLM (OpenAI-compatible) ──────────────────────────────────────────
fast_llm:
  model: "gpt-5-mini"
  timeout: 60
  max_tokens: 16384

# ── Reasoning LLM ─────────────────────────────────────────────────────────
reasoning_llm:
  model: "gpt-5"
  reasoning_effort: "high"
  timeout: 300
  max_tokens: 32768

# ── Chat Interaction LLM (lightweight conversational) ─────────────────────
chat_llm:
  model: "Qwen/Qwen3.5-35B-A3B" #Qwen/Qwen3.6-35B-A3B
  timeout: 30
  max_tokens: 4096
  temperature: 0.7

# ── Translation LLM (dedicated cross-lingual translation) ─────────────────
# Uses local TranslateGemma first when local_base_url is set, then falls back
# to the OpenAI-compatible remote endpoint.
translation_llm:
  local_base_url: ""
  local_target_lang: "en"
  local_timeout: 60
  model: "tencent/Hunyuan-MT-7B"
  timeout: 60
  max_tokens: 8192
  temperature: 0.0
  remote_base_url: ""
  remote_model: ""

# ── Embedding Model ───────────────────────────────────────────────────────
# base_url: per-service container URL.
#   OpenAI-compatible: set to "http://localhost:8002/v1" with api_style: "openai".
#   Simple local:      set to "http://localhost:8099"   with api_style: "simple".
# remote_*: optional remote fallback (e.g. SiliconFlow, OpenAI-compatible).
# When the local embedding container is unavailable, requests fall back to remote.
embedding:
  base_url: ""
  model: "BAAI/bge-m3"
  dimension: 1024
  batch_size: 10
  api_style: "openai"
  remote_base_url: ""
  remote_model: ""

# ── Rerank Model ──────────────────────────────────────────────────────────
# base_url: per-service container URL.
#   OpenAI-compatible: set to "http://localhost:8003/v1" with api_style: "openai".
#   Simple local:      set to "http://localhost:8098"   with api_style: "simple".
# remote_*: optional remote fallback (e.g. SiliconFlow, OpenAI-compatible).
# When the local rerank container is unavailable, requests fall back to remote.
rerank:
  base_url: ""
  model: "BAAI/bge-reranker-v2-m3"
  top_k: 10
  score_threshold: 0.7
  api_style: "openai"
  remote_base_url: ""
  remote_model: ""

# ── MinerU Document Parsing ──────────────────────────────────────────────
# All fields flatten to MINERU_* env vars
# local_parse_url: VLM container endpoint.
# Docker setup: set to "http://localhost:44321"
mineru:
  max_file_size_mb: 100
  remote_poll_interval: 2.0
  remote_max_poll_attempts: 150
  local_parse_url: "http://localhost:44321"
  local_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
  local_timeout: 120.0
  local_dpi: 200

# ── Database Connections ──────────────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  port: 5432
  user: "lingua_seeker"
  db: "lingua_seeker"
  schema: "lingua_seeker"
  pool_size: 20
  max_overflow: 30

redis:
  host: "localhost"
  port: 6379
  db: 0
  max_connections: 20

# ── Neo4j Graph Database ────────────────────────────────────────────────
neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: ""
  database: "neo4j"
  max_connection_pool_size: 10

# ── GraphRAG Context Augmentation ───────────────────────────────────────
# Feature flag for injecting Neo4j subgraph context into Phase 2 extraction.
# enabled: false keeps existing behavior; set to true after seeding Neo4j.
graph_rag:
  enabled: false
  hops: 2
  mode: "full" # "terminology_only" or "full"

# ── Literature Acquisition Providers ────────────────────────────────────
# These flatten to the exact env vars read by the Rust net-io providers
# (std::env::var) and the Python pubmed_service (os.getenv).
#   unpaywall.email  -> UNPAYWALL_EMAIL   (required by Unpaywall API)
#   pubmed.api_key   -> PUBMED_API_KEY    (optional, raises NCBI rate limit 3→10 req/s)
#   base.api_key     -> BASE_API_KEY      (optional, BASE academic search)
#   core.api_key     -> CORE_API_KEY      (optional, CORE search API)
unpaywall:
  email: ""

pubmed:
  api_key: ""

base:
  api_key: ""

core:
  api_key: ""

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Inference Service Auth ─────────────────────────────────────────────
# inference_api_key: shared secret for authenticating with inference service containers.
# Used by embedding, rerank, and doc-parse containers.
# Empty = no auth (services accept all requests).
inference_api_key: ""

# ── Inference Service GPU Settings ───────────────────────────────────────
doc_parse_model_id: ""
embedding_gpu_memory_utilization: 0.90
embedding_max_model_len: 8192
rerank_gpu_memory_utilization: 0.90
rerank_max_model_len: 8192
doc_parse_gpu_memory_utilization: 0.90

# ── Web Search ────────────────────────────────────────────────────────────
web_search:
  base_url: "https://api.firecrawl.dev"
  timeout: 30
  max_results: 10
  tavily_api_key: ""
  tavily_search_depth: "basic"
  serpapi_api_key: ""
  serpapi_engine: "google_scholar"
