[package]
name = "evidence_platform"
version = "0.1.0"
edition = "2021"
description = "Multilingual Document Evidence Collection Platform for ACMG/AMP variant classification"
license = "GPL-3.0"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp"] }

# HTTP client for ClinVar API
reqwest = { version = "0.12", features = ["json"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Environment
dotenvy = "0.15"

# Async trait support
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
