# -- Frontend (Vite+React, static build served by nginx) ----------------------

- name: Install bun runtime (for deploy user)
  shell: >
    curl -fsSL https://bun.sh/install | bash
  args:
    creates: /home/deploy/.bun/bin/bun

- name: Sync frontend source code
  synchronize:
    src: "{{ playbook_dir }}/../../../frontend/"
    dest: "{{ frontend_root }}/"
    delete: yes
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=dist"
  notify: Restart frontend

- name: Install frontend dependencies
  shell: >
    export BUN_INSTALL=/home/deploy/.bun &&
    export PATH=$BUN_INSTALL/bin:$PATH &&
    bun install --frozen-lockfile
  args:
    chdir: "{{ frontend_root }}"
    executable: /bin/bash
  environment:
    BUN_INSTALL: /home/deploy/.bun
    NODE_ENV: "{{ frontend_node_env }}"

- name: Build frontend
  shell: >
    export BUN_INSTALL=/home/deploy/.bun &&
    export PATH=$BUN_INSTALL/bin:$PATH &&
    bun run build
  args:
    chdir: "{{ frontend_root }}"
    executable: /bin/bash
  environment:
    BUN_INSTALL: /home/deploy/.bun
    NODE_ENV: "{{ frontend_node_env }}"

- name: Create lingua-seeker config directory
  file:
    path: /etc/lingua-seeker
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Deploy frontend environment file (secrets)
  template:
    src: frontend.env.j2
    dest: /etc/lingua-seeker/frontend.env
    mode: "0600"
    owner: root
    group: root
  notify:
    - Restart frontend

- name: Deploy frontend systemd service
  template:
    src: acmg-frontend.service.j2
    dest: /etc/systemd/system/acmg-frontend.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart frontend

- name: Ensure frontend is running
  systemd:
    name: acmg-frontend
    state: started
    enabled: yes
