[project]
name = "acmg-intelligence-backend"
version = "1.0.0"
description = "ACMG Evidence Extraction Intelligence System - Backend API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "ACMG Intelligence Team", email = "dev@acmg-system.example.com"}
]
license = {text = "MIT"}
keywords = ["acmg", "evidence-extraction", "biomedical", "nlp", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.22",
    "websockets>=12.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "kombu>=5.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "transitions>=0.9.0",
    "minio>=7.2.20",
    "neo4j>=5.16.0",
    "qdrant-client>=1.7.0",
    "pdfplumber>=0.11.9",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "lingua-language-detector>=2.1.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "testcontainers>=3.7.1",
    "black>=24.10.0",
    "ruff>=0.1.9",
    "mypy>=1.3.0",
    "pdbpp>=0.10.3",
    "icecream>=2.1.10",
    "ipython>=8.20.0",
]
monitoring = [
    "flower>=2.0.1",
    "prometheus-client>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# 设置默认源（优先级最高）
index-url = "http://127.0.0.1:3141/root/pypi/+simple/"

# 配置所有镜像源（按优先级排序）
[[tool.uv.index]]
name = "local"
url = "http://127.0.0.1:3141/root/pypi/+simple/"
default = true  # 默认源，必须设置一个

[[tool.uv.index]]
name = "tuna"  # 清华源（国内最快）
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "ustc"  # 中科大源
url = "https://pypi.mirrors.ustc.edu.cn/simple/"

[[tool.uv.index]]
name = "huaweicloud"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple/"

[[tool.uv.index]]
name = "volces"  # 火山引擎
url = "https://mirrors.volces.com/pypi/simple/"

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[[tool.uv.index]]
name = "pypi"  # 官方源（备用）
url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that hit external services like MinIO, PostgreSQL, Neo4j",
    "unit: fast isolated unit tests",
    "contract: API contract validation tests",
    "slow: slow-running tests",
]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "migrations",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "minio.*",
    "neo4j.*",
    "qdrant_client.*",
    "transitions.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "icecream>=2.1.10",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
