# CI: lint, type-check, and test for backend + frontend.
#
# Runs on every PR and push to dev / master / staging.

name: ci

on:
  push:
    branches: [dev, master, staging]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5"

      - name: Ruff check
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: uvx ruff check --config pyproject.toml

      - name: Ruff format check
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: uvx ruff format --check --config pyproject.toml

  frontend-checks:
    name: frontend lint + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript type-check
        run: bun run type-check

  frontend-test:
    name: frontend test (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [rust-io, files-io, net-io]
    defaults:
      run:
        working-directory: backend/libs/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libssl-dev pkg-config

      - name: cargo test
        run: cargo test
