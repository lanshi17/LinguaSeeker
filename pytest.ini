[pytest]
# Pytest configuration for MinerU integration tests

# Add project root to Python path
pythonpath = .

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests
    unit: Unit tests
    mineru: MinerU-related tests

# Output
addopts = 
    -v
    --tb=short
    --strict-markers

# Timeout
timeout = 300
