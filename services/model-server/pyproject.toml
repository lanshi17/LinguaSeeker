[project]
name = "cross-evidence-model-server"
version = "0.1.0"
description = "Standalone FastAPI inference service (Embedding, Rerank) for Cross Evidence"
requires-python = ">=3.12"
dependencies = [
    "acmg-config-loader",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
parse = [
    "mineru[vlm]>=3.3.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "http://127.0.0.1:3141/root/pypi/+simple/"

[[tool.uv.index]]
name = "local"
url = "http://127.0.0.1:3141/root/pypi/+simple/"
default = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources]
acmg-config-loader = { path = "../../libs/config-loader", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (live inference)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
