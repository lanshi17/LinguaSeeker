---
# Deploy the Rett multilingual acquisition config files in place.
# Static JSON (no secrets, no env substitution) → use copy, not template.
# Idempotent via checksum; re-running reports changed=0 when content is unchanged.
- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ rett_acquisition_dest_dir }}"
    state: directory
    mode: "0755"

- name: Deploy rett_config.json
  ansible.builtin.copy:
    src: literature_acquisition/rett_config.json
    dest: "{{ rett_acquisition_dest_dir }}/rett_config.json"
    mode: "0644"

- name: Deploy rett_config_02.json
  ansible.builtin.copy:
    src: literature_acquisition/rett_config_02.json
    dest: "{{ rett_acquisition_dest_dir }}/rett_config_02.json"
    mode: "0644"
