# ── Model Server — 4-Container Setup ─────────────────────────────────
# Usage:
#   docker compose -f docker-compose.model-server.yml up -d
#   docker compose -f docker-compose.model-server.yml logs -f
#   docker compose -f docker-compose.model-server.yml down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed (nvidia-ctk)
#   - Model weights at /opt/lingua-seeker-data/models/
#   - docker compose v2
#
# Model weight pre-download (one-time):
#   huggingface-cli download Qwen/Qwen3-Embedding-0.6B \
#     --local-dir /opt/lingua-seeker-data/models/embedding/Qwen--Qwen3-Embedding-0.6B
#   huggingface-cli download BAAI/bge-reranker-v2-m3 \
#     --local-dir /opt/lingua-seeker-data/models/rerank/BAAI--bge-reranker-v2-m3
#   huggingface-cli download opendatalab/MinerU2.5-Pro-2604-1.2B \
#     --local-dir /opt/lingua-seeker-data/models/vlm/opendatalab--MinerU2.5-Pro-2604-1.2B
# -------------------------------------------------------------------
services:
  model-embedding:
    build:
      context: ../..
      dockerfile: services/model-server/docker/embedding.Dockerfile
    container_name: lingua-model-embedding
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - /opt/lingua-seeker-data/models/embedding:/models/embedding:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - EMBEDDING_MODEL_ID=/models/embedding/Qwen--Qwen3-Embedding-0.6B
      - EMBEDDING_GPU_MEMORY_UTILIZATION=${EMBEDDING_GPU_MEM:-0.90}
      - API_KEY=${MODEL_SERVER_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  model-rerank:
    build:
      context: ../..
      dockerfile: services/model-server/docker/rerank.Dockerfile
    container_name: lingua-model-rerank
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - /opt/lingua-seeker-data/models/rerank:/models/rerank:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8003
      - RERANK_MODEL_ID=/models/rerank/BAAI--bge-reranker-v2-m3
      - RERANK_GPU_MEMORY_UTILIZATION=${RERANK_GPU_MEM:-0.90}
      - API_KEY=${MODEL_SERVER_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  model-vlm:
    build:
      context: ../..
      dockerfile: services/model-server/docker/vlm.Dockerfile
    container_name: lingua-model-vlm
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - /opt/lingua-seeker-data/models/vlm:/models/vlm:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8004
      - DOC_PARSE_MODEL_ID=/models/vlm/opendatalab--MinerU2.5-Pro-2604-1.2B
      - DOC_PARSE_GPU_MEMORY_UTILIZATION=${DOC_PARSE_GPU_MEM:-0.90}
      - DOC_PARSE_IMAGE_ANALYSIS=${DOC_PARSE_IMAGE_ANALYSIS:-false}
      - API_KEY=${MODEL_SERVER_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  model-doc-parse:
    build:
      context: ../..
      dockerfile: services/model-server/docker/doc-parse.Dockerfile
    container_name: lingua-model-doc-parse
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - /opt/lingua-seeker-data/models/vlm:/models/vlm:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8005
      - DOC_PARSE_BACKEND=vlm
      - DOC_PARSE_MODEL_PATH=/models/vlm/opendatalab--MinerU2.5-Pro-2604-1.2B
      - DOC_PARSE_GPU_MEMORY_UTILIZATION=${DOC_PARSE_GPU_MEM:-0.90}
      - API_KEY=${MODEL_SERVER_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
