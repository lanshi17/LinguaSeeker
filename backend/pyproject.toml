[project]
name = "acmg-lingua-backend"
version = "0.1.0"
description = "ACMG Lingua backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx[socks]>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "maturin>=1.13.1",
    "requests[socks]>=2.33.1",
    "pysocks>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
