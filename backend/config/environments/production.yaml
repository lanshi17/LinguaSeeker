# ============================================================================
# Production Environment Configuration
# ============================================================================
# Copy to production.yaml and customize for your production deployment.
# Secrets go in vault/production.yaml (git-ignored)
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
environment: "production"
debug: false
cors_origins: "https://furong.genemed.tech"

# ── LLM Endpoints (Production) ──────────────────────────────────────────
fast_llm:
  base_url: "https://linxi.chat/v1"

reasoning_llm:
  base_url: "https://linxi.chat/v1"

chat_llm:
  base_url: "https://api.siliconflow.cn"

translation_llm:
  base_url: "https://api.siliconflow.cn"

# ── Inference Services (Production) ──────────────────────────────────────
embedding:
  base_url: "http://localhost:8002/v1"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "Qwen/Qwen3-Embedding-0.6B"

rerank:
  base_url: "http://localhost:8003/v1"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-reranker-v2-m3"

# ── Database Connections (Production) ────────────────────────────────────
postgres:
  host: "postgres-server"
  db: "lingua_seeker"
  schema: "lingua_seeker"

redis:
  host: "redis-server"

# ── Literature Acquisition ────────────────────────────────────────────────
# Unpaywall requires a contact email — set to your institutional address.
# API keys (pubmed/base/core) go in vault/production.yaml.
unpaywall:
  email: "yhvguk@stu.hunau.edu.cn"

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Inference Service Settings ────────────────────────────────────────────
doc_parse_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
