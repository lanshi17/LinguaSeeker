<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingua Seeker</title>
    <meta name="description" content="Multi-Agent infrastructure for medical genetics literature automation and structured evidence extraction." />
    <link rel="icon" type="image/svg+xml" href="https://acmg-bucket.oss-cn-shenzhen.aliyuncs.com/favicon.svg" />
    <script>
      // Prevent flash of wrong theme: read cookie before paint.
      (function(){
        var m=document.cookie.match(/(?:^|;\s*)ls_theme=([^;]+)/);
        var t=m?m[1]:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
        document.documentElement.setAttribute("data-theme",t);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:var(--color-bg,#f5f5f5)">
        <div style="width:40px;height:40px;border:4px solid rgba(8,145,178,.2);border-top-color:#0891b2;border-radius:50%;animation:ls-spin .8s linear infinite"></div>
      </div>
      <style>@keyframes ls-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
