# ============================================================================
# Production Group Variables — Structural Config (Safe to commit)
# ============================================================================
# This file maps 1:1 to backend/config/environments/production.yaml
# Secrets (API keys, passwords) go in vault.yml (ansible-vault encrypted)
#
# Loading order mirrors backend config:
#   1. backend/config/defaults/main.yaml       (app defaults)
#   2. backend/config/environments/production.yaml (app env overrides)
#   3. backend/config/vault/production.yaml    (app secrets)
#   4. Environment variables                   (highest priority)
#
# Ansible injects values via environment variables at deploy time,
# so values here take precedence over file-based config when set.
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
acmg_environment: production
acmg_debug: false
acmg_cors_origins: "https://genemed.tech"
# API key for X-API-Key auth — actual value lives in vault.yml (ansible-vault encrypted).
# Injected by nginx as the X-API-Key header on /api/ requests; the browser never sees it.
# The backend binds to 127.0.0.1, so it is only reachable via nginx.
api_key: "{{ vault_api_key }}"
session_signing_key: "{{ vault_session_signing_key }}"

# ── Domain / TLS ──────────────────────────────────────────────────────────
domain_name: "genemed.tech"
tls_email: "admin@genemed.tech"

# ── Fast LLM ──────────────────────────────────────────────────────────────
fast_llm_base_url: "https://api.siliconflow.cn/v1"
fast_llm_model: "Qwen/Qwen3-8B"
fast_llm_timeout: 60
fast_llm_max_tokens: 16384

# ── Reasoning LLM ─────────────────────────────────────────────────────────
reasoning_llm_base_url: "https://api.siliconflow.cn/v1"
reasoning_llm_model: "Pro/deepseek-ai/DeepSeek-R1"
reasoning_llm_reasoning_effort: "high"
reasoning_llm_timeout: 300
reasoning_llm_max_tokens: 32768

# ── Embedding ─────────────────────────────────────────────────────────────
embedding_base_url: "http://{{ hostvars[groups['app'][0]]['ansible_host'] }}:8002/v1"
embedding_model: "Qwen/Qwen3-Embedding-0.6B"
embedding_dimension: 1024
embedding_batch_size: 10

# ── Rerank ────────────────────────────────────────────────────────────────
rerank_base_url: "http://{{ hostvars[groups['app'][0]]['ansible_host'] }}:8003/v1"
rerank_model: "BAAI/bge-reranker-v2-m3"
rerank_top_k: 10
rerank_score_threshold: 0.7

# ── MinerU Document Parsing ───────────────────────────────────────────────
mineru_max_file_size_mb: 100
mineru_remote_poll_interval: 2.0
mineru_remote_max_poll_attempts: 150
mineru_local_parse_url: "http://{{ hostvars[groups['app'][0]]['ansible_host'] }}:8004"
mineru_local_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
mineru_local_timeout: 120.0
mineru_local_dpi: 200

# ── PostgreSQL ────────────────────────────────────────────────────────────
postgres_host: "{{ hostvars[groups['db'][0]]['ansible_host'] }}"
postgres_port: 5432
postgres_db: "lingua_seeker"
postgres_schema: "lingua_seeker"
postgres_user: "lingua_seeker"
postgres_pool_size: 20
postgres_max_overflow: 30

# ── Redis ─────────────────────────────────────────────────────────────────
redis_host: "{{ hostvars[groups['db'][0]]['ansible_host'] }}"
redis_port: 6379
redis_db: 0
redis_max_connections: 20

# ── Web Search ────────────────────────────────────────────────────────────
web_search_base_url: "https://api.firecrawl.dev"
web_search_timeout: 30
web_search_max_results: 10
# ── Literature Acquisition ───────────────────────────────────────────────
# Unpaywall requires a contact email (not secret — structural config).
# API keys for pubmed/base/core go in vault.yml.
unpaywall_email: "admin@genemed.tech"

# ── Network / Proxy ───────────────────────────────────────────────────────
network_proxy: ""
network_no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Backend Service ───────────────────────────────────────────────────────
backend_port: 8000
backend_workers: 4
backend_log_level: "info"

# ── Frontend Service ──────────────────────────────────────────────────────
# SPA mount path (no trailing slash). "" = root; "/linguaseeker" = subpath.
# Must match the build-time VITE_BASE_PATH baked into the frontend bundle.
frontend_base_path: "/linguaseeker"
frontend_port: 3000
frontend_node_env: "production"

# ── Inference Service Auth ─────────────────────────────────────────────
# API key for authenticating with inference service containers. Actual value in vault.yml.
inference_api_key: "{{ vault_inference_api_key | default('') }}"

# ── Nginx ─────────────────────────────────────────────────────────────────
nginx_worker_processes: "auto"
nginx_worker_connections: 1024
nginx_client_max_body_size: "200m"
