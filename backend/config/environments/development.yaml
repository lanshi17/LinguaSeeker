# ============================================================================
# Development Environment Configuration
# ============================================================================
# Structural overrides for local development. Safe to commit.
# Secrets go in vault/development.yaml (git-ignored)
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
environment: "development"
debug: true
cors_origins: "http://localhost:3000"

# ── LLM Endpoints (Development) ──────────────────────────────────────────
fast_llm:
  base_url: "https://llm-jkbw4lmh2jpi2979.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.7-flash"

reasoning_llm:
  base_url: "https://llm-jkbw4lmh2jpi2979.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.7-plus"

chat_llm:
  base_url: "https://api.siliconflow.cn"

translation_llm:
  local_base_url: "http://localhost:59062/api"
  local_target_lang: "en"
  local_timeout: 60
  base_url: "https://api.siliconflow.cn"

# ── Inference Services (Local) ────────────────────────────────────────────
# Embedding: simple-local API at :8099/embed
# Rerank:    simple-local API at :8098/rerank
embedding:
  base_url: "http://localhost:32949"
  api_style: "simple"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-m3"

rerank:
  base_url: "http://localhost:35001"
  api_style: "simple"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-reranker-v2-m3"

# ── Database Connections (Local) ─────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  db: "dev_lingua_seeker"
  schema: "lingua_seeker"

redis:
  host: "localhost"

neo4j:
  uri: "bolt://localhost:7687"
  database: "dev_lingua_seeker"

graph_rag:
  enabled: true
  hops: 2
  mode: "full"

pipeline:
  cache_enabled: false
  dedup_enabled: false

# ── Literature Acquisition (Development) ──────────────────────────────────
# Unpaywall requires a contact email; set your institutional address here.
# API keys (pubmed/base/core) go in vault/development.yaml.
unpaywall:
  email: "[redacted-email]"

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: "http://127.0.0.1:7890"
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Inference Service Settings ────────────────────────────────────────────
doc_parse_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
