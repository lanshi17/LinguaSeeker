openapi: 3.1.0
info:
  title: ACMG Intelligent Parsing Pipeline API
  version: 1.0.0
  description: |
    REST API for automated ACMG evidence extraction from biomedical literature.
    Supports document upload (PDF/PMID/DOI), asynchronous parsing, evidence review,
    and knowledge graph querying.
  contact:
    name: ACMG-PS3 Intelligence System
    email: support@example.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.acmg-system.example.com/v1
    description: Production

tags:
  - name: documents
    description: Document upload and management
  - name: evidence
    description: Evidence extraction and review
  - name: tasks
    description: Parsing task management
  - name: graph
    description: Knowledge graph queries

paths:
  /documents/upload:
    post:
      tags: [documents]
      summary: Upload PDF document for parsing
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file (max 100MB)
                priority:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 5
                  description: Queue priority (0=low, 10=urgent)
      responses:
        '202':
          description: Document accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '400':
          description: Invalid file format or size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large (>100MB)

  /documents/fetch:
    post:
      tags: [documents]
      summary: Fetch document by PMID or DOI
      operationId: fetchDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pmid:
                  type: string
                  example: "12345678"
                doi:
                  type: string
                  example: "10.1038/nature12345"
                priority:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 5
              oneOf:
                - required: [pmid]
                - required: [doi]
      responses:
        '202':
          description: Fetch request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '404':
          description: PMID/DOI not found in public repositories
        '502':
          description: External repository unavailable

  /documents/{document_id}:
    get:
      tags: [documents]
      summary: Get document metadata and processing status
      operationId: getDocument
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          description: Document not found

  /documents/{document_id}/evidence:
    get:
      tags: [evidence]
      summary: Get all evidence items for a document
      operationId: getDocumentEvidence
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: review_required
          in: query
          schema:
            type: boolean
          description: Filter by review status
        - name: min_confidence
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: Minimum confidence threshold
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id:
                    type: string
                    format: uuid
                  evidence_count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceItem'

  /evidence/{evidence_id}:
    get:
      tags: [evidence]
      summary: Get single evidence item details
      operationId: getEvidence
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evidence details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'

    patch:
      tags: [evidence]
      summary: Edit evidence item (for human review)
      operationId: updateEvidence
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acmg_code:
                  $ref: '#/components/schemas/ACMGCode'
                confidence_score:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                human_notes:
                  type: string
                  maxLength: 2000
                human_reviewed:
                  type: boolean
      responses:
        '200':
          description: Evidence updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'
        '400':
          description: Invalid update data

  /tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get parsing task status
      operationId: getTaskStatus
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'

  /tasks/{task_id}/retry:
    post:
      tags: [tasks]
      summary: Retry failed task
      operationId: retryTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Task retry scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '400':
          description: Task not in FAILED state or retry limit exceeded

  /tasks:
    get:
      tags: [tasks]
      summary: List all tasks with filtering
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskStatusResponse'

  /tasks/{task_id}/priority:
    patch:
      tags: [tasks]
      summary: Update task priority (for urgent documents)
      operationId: updateTaskPriority
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        '200':
          description: Priority updated
        '400':
          description: Invalid priority value

  /tasks/{task_id}/audit-logs:
    get:
      tags: [tasks]
      summary: Get audit trail for task (Agent decision history)
      operationId: getTaskAuditLogs
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: agent_type
          in: query
          schema:
            $ref: '#/components/schemas/AgentType'
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'

  /graph/variants/{hgvs_notation}:
    get:
      tags: [graph]
      summary: Get variant details with aggregated evidence
      operationId: getVariant
      parameters:
        - name: hgvs_notation
          in: path
          required: true
          schema:
            type: string
          example: "NM_000059.3:c.1521_1523delCTT"
      responses:
        '200':
          description: Variant with evidence stacking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'

  /graph/variants/{hgvs_notation}/evidence-stack:
    get:
      tags: [graph]
      summary: Get cross-document evidence stacking analysis
      operationId: getEvidenceStack
      parameters:
        - name: hgvs_notation
          in: path
          required: true
          schema:
            type: string
        - name: min_hops
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 2
          description: Graph traversal depth
      responses:
        '200':
          description: Evidence stacking analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant:
                    $ref: '#/components/schemas/VariantResponse'
                  supporting_documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        evidence_items:
                          type: array
                          items:
                            $ref: '#/components/schemas/EvidenceItem'
                  suggested_upgrade:
                    type: object
                    nullable: true
                    properties:
                      from_code:
                        $ref: '#/components/schemas/ACMGCode'
                      to_code:
                        $ref: '#/components/schemas/ACMGCode'
                      rationale:
                        type: string

components:
  schemas:
    TaskCreatedResponse:
      type: object
      required: [task_id, document_id]
      properties:
        task_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TaskStatus'
        websocket_url:
          type: string
          format: uri
          example: "ws://localhost:8000/ws/task/{task_id}/progress"

    DocumentResponse:
      type: object
      required: [id, title, processing_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              affiliation:
                type: string
        journal:
          type: string
        publication_date:
          type: string
          format: date
        pmid:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        content_hash:
          type: string
        page_count:
          type: integer
        processing_status:
          $ref: '#/components/schemas/ProcessingStatus'
        created_at:
          type: string
          format: date-time

    EvidenceItem:
      type: object
      required: [id, document_id, acmg_code, confidence_score, source_page]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        acmg_code:
          $ref: '#/components/schemas/ACMGCode'
        confidence_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        source_page:
          type: integer
          minimum: 1
        bounding_box:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
        supporting_text:
          type: string
        review_required:
          type: boolean
        human_reviewed:
          type: boolean
        human_notes:
          type: string
          nullable: true
        variant_id:
          type: string
          format: uuid
          nullable: true
        extracted_at:
          type: string
          format: date-time

    TaskStatusResponse:
      type: object
      required: [task_id, document_id, status, current_stage, progress_percentage]
      properties:
        task_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TaskStatus'
        current_stage:
          $ref: '#/components/schemas/AgentStage'
        progress_percentage:
          type: integer
          minimum: 0
          maximum: 100
        retry_count:
          type: integer
        failure_reason:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        estimated_completion:
          type: string
          format: date-time
          nullable: true

    AuditLogEntry:
      type: object
      required: [id, task_id, created_at, agent_type, state_from, state_to, latency_ms]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        agent_type:
          $ref: '#/components/schemas/AgentType'
        state_from:
          type: string
        state_to:
          type: string
        confidence_score:
          type: number
          format: float
          nullable: true
        latency_ms:
          type: integer
        input_prompt:
          type: string
        output_reasoning:
          type: string
        failure_reason:
          type: string
          nullable: true
        model_version:
          type: string

    VariantResponse:
      type: object
      required: [id, hgvs_notation, gene, pathogenicity_classification]
      properties:
        id:
          type: string
          format: uuid
        hgvs_notation:
          type: string
        gene:
          type: string
        chromosome:
          type: string
        position:
          type: integer
        pathogenicity_classification:
          $ref: '#/components/schemas/PathogenicityClass'
        aggregated_confidence:
          type: number
          format: float
        evidence_count:
          type: integer
        associated_phenotypes:
          type: array
          items:
            type: object
            properties:
              hpo_code:
                type: string
              description:
                type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "File size exceeds 100MB limit"
        details:
          type: object
          nullable: true

    ACMGCode:
      type: string
      enum:
        - PS1
        - PS2
        - PS3
        - PS4
        - PM1
        - PM2
        - PM3
        - PM4
        - PM5
        - PM6
        - PP1
        - PP2
        - PP3
        - PP4
        - PP5
        - BA1
        - BS1
        - BS2
        - BS3
        - BS4
        - BP1
        - BP2
        - BP3
        - BP4
        - BP5
        - BP6
        - BP7

    TaskStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - RETRY

    ProcessingStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - NEEDS_REVIEW

    AgentStage:
      type: string
      enum:
        - INGESTION
        - DECOMPOSITION
        - LAYOUT
        - TRANSLATION
        - EVIDENCE
        - ARBITRATION
        - COMPLETED

    AgentType:
      type: string
      enum:
        - LAYOUT
        - TRANSLATION
        - EVIDENCE
        - ARBITRATION

    PathogenicityClass:
      type: string
      enum:
        - BENIGN
        - LIKELY_BENIGN
        - VUS
        - LIKELY_PATHOGENIC
        - PATHOGENIC
        - CONFLICTING

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
