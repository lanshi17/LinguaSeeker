[package]
name = "http-io"
version = "0.1.0"
edition = "2024"
description = "High-performance HTTP/web I/O for ACMG Lingua"

[lib]
name = "http_io"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.28.2" }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls", "gzip", "socks"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.26"
thiserror = "2"
url = "2"
pythonize = "0.28"
urlencoding = "2"
