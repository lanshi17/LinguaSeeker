# ============================================================================
# Development Environment Configuration
# ============================================================================
# Structural overrides for local development. Safe to commit.
# Secrets go in vault/development.yaml (git-ignored)
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
environment: "development"
debug: true
cors_origins: "*"

# ── LLM Endpoints (Development) ──────────────────────────────────────────
fast_llm:
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"

reasoning_llm:
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"

# ── Model Server (Local) ─────────────────────────────────────────────────
embedding:
  base_url: "http://localhost:8001/v1"

rerank:
  base_url: "http://localhost:8001/v1"

# ── Database Connections (Local) ─────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  db: "lingua_dev"
  schema: "lingua"

redis:
  host: "localhost"

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: "http://127.0.0.1:7890"
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Model Server GPU Settings (Development) ─────────────────────────────
# Kept at top level for model-server compatibility
vlm_model_id: ""
