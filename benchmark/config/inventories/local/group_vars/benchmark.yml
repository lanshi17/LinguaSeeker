---
# Non-secret configuration for the Rett annotation benchmark tool.
# Source of truth rendered to benchmark/datasets/rett_annotation/config.yaml.
# Secrets live in vault/secrets.yml (ansible-vault encrypted, gitignored).

# Canonical destination root for rendered configs. Resolves to
# <repo-root>/benchmark/datasets/rett_annotation regardless of CWD, because
# playbook_dir is an absolute path to benchmark/config/playbooks.
rett_annotation_dest_root: "{{ (playbook_dir | dirname | dirname) }}/datasets/rett_annotation"
rett_annotation_config_dest: "{{ rett_annotation_dest_root }}/config.yaml"
rett_annotation_env_dest: "{{ rett_annotation_dest_root }}/.env"

rett_annotation_llm:
  base_url: "https://linxi.chat/v1"
  model: "gpt-5-nano"
  max_tokens: 32768
  temperature: 0.0
  timeout: 120

# Optional fallback provider. When enabled, a llm_fallback block is emitted.
rett_annotation_llm_fallback:
  enabled: false
  base_url: "https://api.siliconflow.cn/v1"
  model: "deepseek-ai/DeepSeek-V3"
  max_tokens: 8192
  temperature: 0.0
  timeout: 120

rett_annotation_pdf_parser:
  backend: "mineru"  # mineru | pymupdf (fallback)
  mineru_base_url: "https://mineru.net/api/v4"
  mineru_model_version: "vlm"
  mineru_enable_formula: true
  mineru_enable_table: true
  mineru_language: "ch"
  poll_interval: 3.0
  max_poll_attempts: 200
  batch_size: 10

rett_annotation_annotation:
  max_concurrency: 3
  chunk_size: 12000

rett_annotation_paths:
  pdf_source_dir: "../literature_acquisition/downloads/rett"
  draft_dir: "./draft"
  approved_dir: "./approved"
  rejected_dir: "./rejected"
  ground_truth_dir: "./ground_truth"
