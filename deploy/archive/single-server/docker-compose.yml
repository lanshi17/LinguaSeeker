# ============================================================================
# Lingua Seeker — Single-Server Deployment (CentOS 7.9 + GPU)
# ============================================================================
# All services on one machine: backend + postgres + redis. Inference services (embedding/rerank/doc-parse) are external.
# Uses pre-built Docker Hub images — no source build step needed.
#
# Usage:
#   cd /opt/lingua-seeker
#   cp deploy/compose/single-server/.env.example .env   # fill in secrets
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d
#
# Prerequisites:
#   - Docker CE 20.10+ (CentOS 7 compatible)
#   - NVIDIA Container Toolkit (nvidia-ctk)
#
# Architecture:
#   nginx (host) → backend:8000 → postgres:5432 + redis:6379
#                                   ↓
#   host-published inference ports (GPU): embedding/rerank/doc-parse
# ============================================================================
services:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-docker.io/lanshi47/lingua-seeker-backend}:${IMAGE_TAG:-latest}
    container_name: lingua-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_KEY: ${API_KEY}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      # ── Postgres ──
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-lingua_seeker}
      # ── Redis ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ── Neo4j ──
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # ── External Inference Service endpoints ──
      # Defaults target same-host simple FastAPI containers via host-published ports.
      # Override to http://model-embedding:8002/v1 + openai if services share a Docker network.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:32949}
      EMBEDDING_API_STYLE: ${EMBEDDING_API_STYLE:-simple}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://host.docker.internal:35001}
      RERANK_API_STYLE: ${RERANK_API_STYLE:-simple}
      # Doc-parse: MinerU native PDF parsing via /file_parse
      MINERU_LOCAL_PARSE_URL: ${MINERU_LOCAL_PARSE_URL:-http://host.docker.internal:44321}
      # ── LLM endpoints ──
      FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL}
      FAST_LLM_API_KEY: ${FAST_LLM_API_KEY}
      REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL}
      REASONING_LLM_API_KEY: ${REASONING_LLM_API_KEY}
      CHAT_LLM_BASE_URL: ${CHAT_LLM_BASE_URL}
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY}
      TRANSLATION_LLM_BASE_URL: ${TRANSLATION_LLM_BASE_URL}
      TRANSLATION_LLM_API_KEY: ${TRANSLATION_LLM_API_KEY}
      TRANSLATION_LLM_LOCAL_BASE_URL: ${TRANSLATION_LLM_LOCAL_BASE_URL:-http://host.docker.internal:59062/api}
      TRANSLATION_LLM_LOCAL_TARGET_LANG: ${TRANSLATION_LLM_LOCAL_TARGET_LANG:-en}
      TRANSLATION_LLM_LOCAL_TIMEOUT: ${TRANSLATION_LLM_LOCAL_TIMEOUT:-120}
      # ── Inference Service auth ──
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      # ── Literature acquisition ──
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      # ── MinerU ──
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_downloads:/app/downloads
      - backend_output:/app/output
      # Production config (read-only)
      - ./config/environments/production.yaml:/app/config/environments/production.yaml:ro
      - ./config/vault/production.yaml:/app/config/vault/production.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── PostgreSQL (with pgvector) ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lingua-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingua_seeker} -d ${POSTGRES_DB:-lingua_seeker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    container_name: lingua-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Neo4j ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: lingua-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/lingua_seeker}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7474/dbms/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  backend_logs:
  backend_data:
  backend_downloads:
  backend_output:
