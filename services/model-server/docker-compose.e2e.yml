# ── E2E Test Override ────────────────────────────────────────────────
# Overrides model paths for local testing. Use with:
#   docker-compose -f docker-compose.model-server.yml -f docker-compose.e2e.yml up model-embedding
# -------------------------------------------------------------------
services:
  model-embedding:
    volumes:
      - /data/[redacted-user]/model-weights/embedding:/models/embedding:ro

  model-rerank:
    volumes:
      - /data/[redacted-user]/model-weights/rerank:/models/rerank:ro

  model-vlm:
    volumes:
      - /data/[redacted-user]/model-weights/vlm:/models/vlm:ro

  model-doc-parse:
    volumes:
      - /data/[redacted-user]/model-weights/vlm:/models/vlm:ro
