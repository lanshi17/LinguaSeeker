---
# Deploy (render) all benchmark configuration managed by benchmark/config/.
# Run from benchmark/config/:
#   ansible-playbook playbooks/deploy-config.yml
- name: Deploy benchmark configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vault/secrets.yml
  roles:
    - role: rett_annotation_config
    - role: rett_acquisition_config
