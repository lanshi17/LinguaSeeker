# ============================================================================
# Lingua Seeker Staging Inventory
# ============================================================================
# Hostnames and connection details for staging environment.
# Mirrors production topology but may use fewer/smaller hosts.
# Secrets go in group_vars/vault.yml (ansible-vault encrypted)
# ============================================================================

all:
  children:
    web:
      hosts:
        web-01:
          ansible_host: "198.51.100.10"             # Replace with actual staging IP
          ansible_port: 22
    app:
      hosts:
        app-01:
          ansible_host: "198.51.100.20"             # Replace with actual staging IP
          ansible_port: 22
    db:
      hosts:
        db-01:
          ansible_host: "198.51.100.30"             # Replace with actual staging IP
          ansible_port: 22

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    project_root: /opt/lingua-seeker
    backend_root: "{{ project_root }}/backend"
    frontend_root: "{{ project_root }}/frontend"
    deploy_env: staging
