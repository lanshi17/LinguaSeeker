# =============================================================================
# Neo4j Configuration - Bolt Protocol
# =============================================================================
# Reference configuration only.
# Runtime settings are injected via NEO4J_* environment variables in
# database/podman-compose.yml to avoid container startup mutations on host files.
# =============================================================================

# -----------------------------------------------------------------------------
# Bolt Connector Configuration
# -----------------------------------------------------------------------------
# Enable the Bolt connector for database connections
server.bolt.enabled=true

# Bolt listening address (0.0.0.0 allows external connections)
server.bolt.listen_address=0.0.0.0:7687

# Bolt advertised address (used by clients to connect)
# Format: hostname:port or :port (uses default hostname)
server.bolt.advertised_address=:7687

# -----------------------------------------------------------------------------
# Bolt TLS/SSL Configuration
# -----------------------------------------------------------------------------
# TLS Level: DISABLED, OPTIONAL, or REQUIRED
# - DISABLED: No encryption (default for development)
# - OPTIONAL: Clients can choose to use encryption
# - REQUIRED: All connections must use encryption
server.bolt.tls_level=DISABLED

# -----------------------------------------------------------------------------
# Bolt Connection Limits
# -----------------------------------------------------------------------------
# Maximum number of concurrent Bolt connections
# server.bolt.connection_limit=1000

# Connection timeout in milliseconds
# server.bolt.connection_timeout=30000

# -----------------------------------------------------------------------------
# SSL Policy for Bolt (when TLS is enabled)
# -----------------------------------------------------------------------------
# Enable SSL policy for Bolt connector
# dbms.ssl.policy.bolt.enabled=true

# Base directory for SSL certificates
# dbms.ssl.policy.bolt.base_directory=certificates/bolt

# Private key file name (relative to base_directory)
# dbms.ssl.policy.bolt.private_key=private.key

# Public certificate file name (relative to base_directory)
# dbms.ssl.policy.bolt.public_certificate=public.crt

# Client authentication mode: NONE, OPTIONAL, or REQUIRED
# dbms.ssl.policy.bolt.client_auth=NONE

# Trusted certificates directory
# dbms.ssl.policy.bolt.trusted_directory=trusted

# -----------------------------------------------------------------------------
# Additional Bolt Settings
# -----------------------------------------------------------------------------
# Enable logging for Bolt connections (for debugging)
# server.bolt.logging=DEBUG

# Max frame size for Bolt protocol
# server.bolt.max_frame_size=16777215

# Max transaction time in seconds (0 = unlimited)
# server.bolt.max_transaction_time=0

server.memory.pagecache.size=512M

server.default_listen_address=0.0.0.0
server.directories.plugins=/plugins
server.directories.logs=/logs
server.directories.import=/import
