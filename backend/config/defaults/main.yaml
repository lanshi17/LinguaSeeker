# ============================================================================
# ACMG-Lingua Backend — Default Configuration Variables
# ============================================================================
# Base structural defaults for all environments. Safe to commit.
# Override in environments/<env>.yaml and vault/<env>.yaml
#
# Loading order (lowest to highest priority):
#   1. defaults/main.yaml          (this file)
#   2. environments/<env>.yaml     (environment-specific structural config)
#   3. vault/<env>.yaml            (secrets: API keys, passwords)
#   4. Environment variables       (highest priority, override all)
#
# Field naming convention:
#   - Nested fields (e.g. fast_llm.model) flatten to FAST_LLM_MODEL
#   - Top-level fields (e.g. api_host) flatten to API_HOST
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
# Only keep fields that are actually used in code
cors_origins: "*"
environment: "development"
debug: false

# ── Fast LLM (OpenAI-compatible) ──────────────────────────────────────────
fast_llm:
  model: "mimo-v2.5"
  timeout: 60

# ── Reasoning LLM ─────────────────────────────────────────────────────────
reasoning_llm:
  model: "mimo-v2.5-pro"
  reasoning_effort: "xhigh"
  timeout: 300

# ── Embedding Model ───────────────────────────────────────────────────────
embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  dimension: 1024
  batch_size: 10

# ── Rerank Model ──────────────────────────────────────────────────────────
rerank:
  model: "bge-reranker-v2-m3"
  top_k: 10
  score_threshold: 0.7

# ── MinerU Document Parsing ──────────────────────────────────────────────
mineru:
  max_file_size_mb: 100

# ── Parse Document Configuration ─────────────────────────────────────────
# These flatten to MINERU_REMOTE_* and MINERU_LOCAL_* env vars
mineru_remote_poll_interval: 2.0
mineru_remote_max_poll_attempts: 150
mineru_local_model_server_url: "http://localhost:8001"
mineru_local_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
mineru_local_timeout: 120.0
mineru_local_dpi: 200

# ── Database Connections ──────────────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  port: 5432
  db: "acmg_lingua"
  schema: "acmg_app"
  pool_size: 20
  max_overflow: 30

redis:
  host: "localhost"
  port: 6379
  db: 0
  max_connections: 20

# ── Web Search ────────────────────────────────────────────────────────────
web_search:
  base_url: "https://api.firecrawl.dev"
  timeout: 30
  max_results: 10

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Evidence Extraction ──────────────────────────────────────────────────
evidence_extraction:
  api_key: ""
  base_url: ""
  reasoning_api_key: ""
  reasoning_base_url: ""
  fast_model: ""
  standard_model: ""
  strong_model: ""
  fast_effort: ""
  standard_effort: ""
  strong_effort: "high"
  temperature: 0.0
  timeout: 180
  max_retries: 3

# ── Model Server GPU Settings ────────────────────────────────────────────
# Kept at top level for model-server compatibility
vlm_model_id: ""
embedding_gpu_memory_utilization: 0.35
embedding_max_model_len: 4096
rerank_gpu_memory_utilization: 0.20
vlm_gpu_memory_utilization: 0.50
