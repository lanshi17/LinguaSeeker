# Alembic configuration for Cross Evidence async PostgreSQL migrations.
#
# Run from the repo root:
#   uv run alembic -c database/alembic.ini upgrade head
#   uv run alembic -c database/alembic.ini revision --autogenerate -m "description"

[alembic]
# Path to migration scripts — %(here)s points to this file's directory.
script_location = %(here)s/migrations

# Output encoding for migration files.
prepend_sys_path = .
path_separator = os

# Logging template.
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for generated migrations.
timezone = UTC

# Truncate slug length.
truncate_slug_length = 40

# sqlalchemy.url is set dynamically in env.py from app config.
# DO NOT hardcode a DSN here.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
