[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rust-io"
requires-python = ">=3.12"
description = "High-performance Rust native extensions for Lingua Seeker: literature search, MinerU document parsing, file I/O, S3, archives, and SHA-256 dedup."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Lingua Seeker Team" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/lanshi17/lingua-seeker"
Repository = "https://github.com/lanshi17/lingua-seeker"

[tool.maturin]
features = ["pyo3/extension-module"]
