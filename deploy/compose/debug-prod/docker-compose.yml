# ============================================================================
# Debug-Prod — production-config backend in Docker, no GPU model servers.
#
# Reuses the pre-built lingua-seeker-backend:local image (no build step).
# Mounts backend/config/ read-only so YAML edits take effect on restart
# without rebuilding the image.
#
# Usage:
#   cd /data/yangzs/Projects/01_ACMG_Lingua
#   cp deploy/compose/debug-prod/.env.example deploy/compose/debug-prod/.env
#   # fill in secrets, then:
#   docker compose -f deploy/compose/debug-prod/docker-compose.yml \
#                  --env-file deploy/compose/debug-prod/.env up -d
#
# Update code without uv (thin overlay, seconds):
#   docker build -t lingua-seeker-backend:local \
#     -f deploy/compose/single-server/patch-backend.Dockerfile .
#
# Debug:
#   docker compose -f deploy/compose/debug-prod/docker-compose.yml logs -f backend
#   docker compose -f deploy/compose/debug-prod/docker-compose.yml exec backend bash
# ============================================================================
services:
  backend:
    image: lingua-seeker-backend:local
    container_name: lingua-debug-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_KEY: ${API_KEY}
      # ── Postgres (compose service names override vault's postgres-server) ──
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-lingua_seeker}
      # ── Redis ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ── LLM endpoints (API keys come from vault/production.yaml) ──
      FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL:-https://linxi.chat/v1}
      REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL:-https://linxi.chat/v1}
      # Embedding/Rerank base_url + remote_base_url come from the mounted
      # production.yaml. Local (localhost:8001) fails fast in the container,
      # FallbackEmbeddingProvider transparently falls back to remote (SiliconFlow).
      # To use the host's model-server instead, edit production.yaml:
      #   embedding.base_url: "http://host.docker.internal:8001/v1"
      # (requires model-server bound to 0.0.0.0, not 127.0.0.1)
    volumes:
      # Live config — edit backend/config/*.yaml, restart container, no rebuild.
      - ../../../backend/config:/app/config:ro
      - debug_backend_logs:/app/logs
      - debug_backend_data:/app/data
      - debug_backend_downloads:/app/downloads
      - debug_backend_output:/app/output
    # Lets the container reach a model-server running on the host via
    # http://host.docker.internal:8001/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: lingua-debug-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - debug_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingua_seeker} -d ${POSTGRES_DB:-lingua_seeker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0-alpine
    container_name: lingua-debug-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - debug_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  debug_postgres_data:
  debug_redis_data:
  debug_backend_logs:
  debug_backend_data:
  debug_backend_downloads:
  debug_backend_output:
