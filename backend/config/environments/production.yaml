# ============================================================================
# Production Environment Configuration
# ============================================================================
# Copy to production.yaml and customize for your production deployment.
# Secrets go in vault/production.yaml (git-ignored)
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
environment: "production"
debug: false
cors_origins: "https://furong.genemed.tech/linguaseeker"

# ── LLM Endpoints (Production) ──────────────────────────────────────────
fast_llm:
  model: "gpt-5-mini" #gpt-5-mini
  timeout: 60
  max_tokens: 16384
  base_url: "https://linxi.chat/v1"

reasoning_llm:
  model: "gpt-5"
  timeout: 300
  max_tokens: 32768
  base_url: "https://linxi.chat/v1"

chat_llm:
  model: "Qwen/Qwen3.5-35B-A3B"
  timeout: 30
  max_tokens: 4096
  temperature: 0.7
  base_url: "https://api.siliconflow.cn"

translation_llm:
  local_base_url: "http://localhost:59062/api"
  local_target_lang: "en"
  local_timeout: 60
  base_url: "https://api.siliconflow.cn"

# ── Inference Services (Production) ──────────────────────────────────────
embedding:
  base_url: "http://localhost:32949"
  api_style: "simple"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-m3"

rerank:
  base_url: "http://localhost:35001"
  api_style: "simple"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-reranker-v2-m3"

mineru:
  max_file_size_mb: 100
  remote_poll_interval: 2.0
  remote_max_poll_attempts: 150
  local_parse_url: "http://localhost:44321"
  local_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
  local_timeout: 120.0
  local_dpi: 200

# ── Database Connections (Production) ────────────────────────────────────
postgres:
  host: "postgres-server"
  db: "lingua_seeker"
  schema: "lingua_seeker"

redis:
  host: "redis-server"

pipeline:
  cache_enabled: true
  dedup_enabled: true

# ── Literature Acquisition ────────────────────────────────────────────────
# Unpaywall requires a contact email — set to your institutional address.
# API keys (pubmed/base/core) go in vault/production.yaml.
unpaywall:
  email: "[redacted-email]"

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Inference Service Settings ────────────────────────────────────────────
doc_parse_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
