# ── Nginx Reverse Proxy ───────────────────────────────────────────────────

- name: Install Nginx and Certbot
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if TLS certificate already exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: acmg_tls_cert

- name: Deploy Nginx main config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: "nginx -t -c %s"
  notify: Reload Nginx

- name: Deploy Nginx site config (HTTP-only, for initial cert provisioning)
  template:
    src: cross-evidence-http.conf.j2
    dest: /etc/nginx/sites-available/cross-evidence.conf
    mode: "0644"
  when: not acmg_tls_cert.stat.exists
  notify: Reload Nginx

- name: Deploy Nginx site config (full TLS)
  template:
    src: cross-evidence.conf.j2
    dest: /etc/nginx/sites-available/cross-evidence.conf
    mode: "0644"
  when: acmg_tls_cert.stat.exists
  notify: Reload Nginx

- name: Enable site config
  file:
    src: /etc/nginx/sites-available/cross-evidence.conf
    dest: /etc/nginx/sites-enabled/cross-evidence.conf
    state: link
  notify: Reload Nginx

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: started
    enabled: yes

# ── TLS Certificate Provisioning ──────────────────────────────────────────

- name: Reload Nginx before certbot
  systemd:
    name: nginx
    state: reloaded
  when: not acmg_tls_cert.stat.exists

- name: Provision TLS certificate via certbot
  command: >
    certbot certonly --nginx
    -d {{ domain_name }}
    --non-interactive
    --agree-tos
    -m {{ tls_email }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

- name: Redeploy site config with TLS after cert provisioning
  template:
    src: cross-evidence.conf.j2
    dest: /etc/nginx/sites-available/cross-evidence.conf
    mode: "0644"
  notify: Reload Nginx

- name: Enable certbot auto-renewal timer
  systemd:
    name: certbot.timer
    state: started
    enabled: yes
