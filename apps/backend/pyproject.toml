[project]
name = "acmg-ps3-backend"
version = "2.1.0"
description = "ACMG-PS3 Intelligence System - Backend Service with GraphRAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.128.5",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.12.0",
    # Agent Framework
    "langgraph>=1.0.8",
    "langchain[openai]>=1.2.9",
    "langchain-core>=1.2.9",
    # LLM Providers
    "openai>=2.17.0",    # For DeepSeek (OpenAI-compatible) and Claude
    # Database Clients
    "neo4j>=6.1.0",          # Neo4j Graph Database
    "pymilvus>=2.6.8",        # Milvus Vector Database
    "qdrant-client>=1.16.2",
    "psycopg2-binary>=2.9.11", # PostgreSQL
    "sqlalchemy>=2.0.46",     # ORM
    "alembic>=1.18.3",        # Database migrations
    # Object Storage
    "minio>=7.2.20", # MinIO client
    # PDF Parsing
    "magic-pdf>=1.3.12", # MinerU
    # Embedding & NLP
    "sentence-transformers>=3.3.0",
    "tiktoken>=0.12.0",
    # Utilities
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "aiohttp>=3.13.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",            # Retry logic
    "requests>=2.32.5",
    "websockets>=16.0",
    "python-multipart>=0.0.22",
    "pdfplumber>=0.11.7",
    "langchain-openai>=1.1.7",
    "langchain-qdrant>=1.1.0",
    "langchain-community>=0.4.1",
    "dashscope>=1.25.12",
    "celery>=5.6.2",
    "redis>=7.1.0",
    "redis-cli>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=26.1.0",
    "ruff>=0.15.0",
    "mypy>=1.19.1",
]
[tool.setuptools]
packages = ["src"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/acmg_ps3_backend"]

[dependency-groups]
dev = [
    "icecream>=2.1.10",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as asyncio-compatible",
]
asyncio_mode = "auto"
