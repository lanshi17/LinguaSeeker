[project]
name = "acmg-config-loader"
version = "0.1.0"
description = "Layered YAML config loader shared by backend services and model-server"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acmg_config_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
