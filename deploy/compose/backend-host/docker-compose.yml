# ============================================================================
# Backend host — runs FastAPI + Postgres + Redis behind the host firewall.
# Uses a pre-built backend image from Docker Hub. From the repo root:
#
#   docker compose -f deploy/compose/backend-host/docker-compose.yml \
#                  --env-file deploy/compose/backend-host/.env \
#                  pull
#   docker compose -f deploy/compose/backend-host/docker-compose.yml \
#                  --env-file deploy/compose/backend-host/.env \
#                  up -d
#
# Only the backend port is published; database + redis stay private.
#
# ── Volume ownership (required) ─────────────────────────────────────
# The image runs as non-root uid 1000 (deploy). Bind-mounted host dirs
# must be writable by uid 1000, or the pipeline fails with
# "[Errno 13] Permission denied: /app/data/pipeline". One-time setup:
#   chown -R 1000:1000 ./logs ./data ./downloads ./output
# ============================================================================
services:
  backend:
    image: ${BACKEND_IMAGE:-docker.io/lanshi47/lingua-seeker-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Loopback by default — expose to the frontend host via BACKEND_BIND=0.0.0.0
    # when needed. X-API-Key auth is enforced inside FastAPI.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Lets the backend trust X-Forwarded-* from the frontend nginx.
      # See uvicorn --proxy-headers --forwarded-allow-ips in the Dockerfile.
      CORS_ORIGINS: ${CORS_ORIGINS}              # e.g. https://app.example.com
      API_KEY: ${API_KEY}                        # shared with frontend nginx
      # ── Datastores ─────────────────────────────────────────────────
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-lingua_seeker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ── Neo4j graph ──────────────────────────────────────────────
      # The backend reads NEO4J_* from env (env vars win over the layered
      # YAML config the loader looks up under /app/backend/config, which is
      # NOT where the deployed /app/config mounts live). Same NEO4J_PASSWORD
      # var drives both the neo4j container auth and this connection.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # ── Inference / LLM endpoints (point at GPU host) ───────────
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:32949}
      EMBEDDING_API_STYLE: ${EMBEDDING_API_STYLE:-simple}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://host.docker.internal:35001}
      RERANK_API_STYLE: ${RERANK_API_STYLE:-simple}
      MINERU_LOCAL_PARSE_URL: ${MINERU_LOCAL_PARSE_URL:-http://host.docker.internal:44321}
      FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL}
      REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL}
      REASONING_LLM_REASONING_EFFORT: ${REASONING_LLM_REASONING_EFFORT:-high}
      TRANSLATION_LLM_LOCAL_BASE_URL: ${TRANSLATION_LLM_LOCAL_BASE_URL:-http://host.docker.internal:59062/api}
      TRANSLATION_LLM_LOCAL_TARGET_LANG: ${TRANSLATION_LLM_LOCAL_TARGET_LANG:-en}
      TRANSLATION_LLM_LOCAL_TIMEOUT: ${TRANSLATION_LLM_LOCAL_TIMEOUT:-120}
      # Keep Python and legacy file paths on the writable backend data mount.
      TMPDIR: /app/data/tmp
      TEMP: /app/data/tmp
      TMP: /app/data/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./data:/data
      - ./downloads:/app/downloads
      - ./output:/app/output
      # Vault 配置文件保持只读
      - ./config/production.yaml:/app/config/environments/production.yaml:ro
      - ./config/vault/production.yaml:/app/config/vault/production.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # Loopback-only — never published to the frontend host.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingua_seeker}
      POSTGRES_USER: ${POSTGRES_USER:-lingua_seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingua_seeker} -d ${POSTGRES_DB:-lingua_seeker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: >
      redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # NEO4J_AUTH sets the default user/password at first start.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # neo4j 5.x has built-in `neo4j status` — most reliable probe.
      test: ["CMD-SHELL", "neo4j status | grep -q 'is running' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  backend_logs:
  backend_data:
  backend_downloads:
  backend_output:
