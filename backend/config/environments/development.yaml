# ============================================================================
# Development Environment Configuration
# ============================================================================
# Structural overrides for local development. Safe to commit.
# Secrets go in vault/development.yaml (git-ignored)
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
environment: "development"
debug: true
cors_origins: "*"

# ── LLM Endpoints (Development) ──────────────────────────────────────────
fast_llm:
  base_url: "https://linxi.chat/v1"

reasoning_llm:
  base_url: "https://linxi.chat/v1"

chat_llm:
  base_url: "https://api.siliconflow.cn"

translation_llm:
  base_url: "https://api.siliconflow.cn"

# ── Model Server (Local) ─────────────────────────────────────────────────
embedding:
  base_url: "http://localhost:8001/v1"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "Qwen/Qwen3-Embedding-0.6B"

rerank:
  base_url: "http://localhost:8001/v1"
  remote_base_url: "https://linxi.chat/v1"
  remote_model: "Qwen/Qwen3-Reranker-0.6B"

# ── Database Connections (Local) ─────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  db: "dev_lingua_seeker"
  schema: "lingua"

redis:
  host: "localhost"

# ── Literature Acquisition (Development) ──────────────────────────────────
# Unpaywall requires a contact email; set your institutional address here.
# API keys (pubmed/base/core) go in vault/development.yaml.
unpaywall:
  email: "yhvguk@stu.hunau.edu.cn"

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: "http://127.0.0.1:7890"
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Model Server GPU Settings (Development) ─────────────────────────────
# Kept at top level for model-server compatibility
doc_parse_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
