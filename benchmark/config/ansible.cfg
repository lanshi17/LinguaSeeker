# Ansible configuration for the benchmark subproject.
# Run all commands from this directory (benchmark/config/), e.g.:
#   ansible-playbook playbooks/deploy-config.yml
[defaults]
inventory = inventories/local/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
# Vault password file (gitignored). Generate with:
#   openssl rand -base64 24 > .vault_pass && chmod 600 .vault_pass
vault_password_file = .vault_pass
