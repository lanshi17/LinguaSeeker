# ============================================================================
# Staging Environment Configuration
# ============================================================================
# Mirrors production structure for pre-release validation.
# Secrets go in vault/staging.yaml (git-ignored)
# ============================================================================

# -- Application -------------------------------------------------------------
environment: "staging"
debug: false
cors_origins: "https://staging.furong.genemed.tech"

# -- LLM Endpoints (Staging) ------------------------------------------------
fast_llm:
  base_url: "https://linxi.chat/v1"

reasoning_llm:
  base_url: "https://linxi.chat/v1"

chat_llm:
  base_url: "https://api.siliconflow.cn"

translation_llm:
  local_base_url: ""
  local_target_lang: "en"
  local_timeout: 60
  base_url: "https://api.siliconflow.cn"

# -- Inference Services (Staging — multi-container mode) --------------------
embedding:
  base_url: "http://embedding-server:8002/v1"
  api_style: "openai"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-m3"

rerank:
  base_url: "http://rerank-server:8003/v1"
  api_style: "openai"
  remote_base_url: "https://api.siliconflow.cn"
  remote_model: "BAAI/bge-reranker-v2-m3"

# -- Database Connections (Staging) ------------------------------------------
postgres:
  host: "postgres"
  db: "staging_lingua_seeker"
  schema: "lingua_seeker"

redis:
  host: "redis"

pipeline:
  cache_enabled: true
  dedup_enabled: true

# -- Literature Acquisition ---------------------------------------------------
unpaywall:
  email: "[redacted-email]"

# -- Network / Proxy ---------------------------------------------------------
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# -- Inference Service GPU Settings (Staging — multi-container) --------------
doc_parse_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
