# ============================================================================
# Cross Evidence Backend — Default Configuration Variables
# ============================================================================
# Base structural defaults for all environments. Safe to commit.
# Override in environments/<env>.yaml and vault/<env>.yaml
#
# Loading order (lowest to highest priority):
#   1. defaults/main.yaml          (this file)
#   2. environments/<env>.yaml     (environment-specific structural config)
#   3. vault/<env>.yaml            (secrets: API keys, passwords)
#   4. Environment variables       (highest priority, override all)
#
# Field naming convention:
#   - Nested fields (e.g. fast_llm.model) flatten to FAST_LLM_MODEL
#   - Top-level fields (e.g. cors_origins) flatten to CORS_ORIGINS
# ============================================================================

# ── Application ───────────────────────────────────────────────────────────
cors_origins: "*"
environment: "development"
debug: false

# ── Fast LLM (OpenAI-compatible) ──────────────────────────────────────────
fast_llm:
  model: "mimo-v2.5"
  timeout: 60
  max_tokens: 16384

# ── Reasoning LLM ─────────────────────────────────────────────────────────
reasoning_llm:
  model: "mimo-v2.5-pro"
  reasoning_effort: "high"
  timeout: 300
  max_tokens: 32768

# ── Chat Interaction LLM (lightweight conversational) ─────────────────────
chat_llm:
  model: "nex-agi/Nex-N2-Pro" #Qwen/Qwen3.6-35B-A3B
  timeout: 30
  max_tokens: 4096
  temperature: 0.7

# ── Embedding Model ───────────────────────────────────────────────────────
embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  dimension: 1024
  batch_size: 10

# ── Rerank Model ──────────────────────────────────────────────────────────
rerank:
  model: "bge-reranker-v2-m3"
  top_k: 10
  score_threshold: 0.7

# ── MinerU Document Parsing ──────────────────────────────────────────────
# All fields flatten to MINERU_* env vars
mineru:
  max_file_size_mb: 100
  remote_poll_interval: 2.0
  remote_max_poll_attempts: 150
  local_model_server_url: "http://localhost:8001"
  local_model_id: "opendatalab/MinerU2.5-Pro-2604-1.2B"
  local_timeout: 120.0
  local_dpi: 200

# ── Database Connections ──────────────────────────────────────────────────
postgres:
  host: "127.0.0.1"
  port: 5432
  db: "cross_evidence"
  schema: "acmg_app"
  pool_size: 20
  max_overflow: 30

redis:
  host: "localhost"
  port: 6379
  db: 0
  max_connections: 20

# ── Web Search ────────────────────────────────────────────────────────────
web_search:
  base_url: "https://api.firecrawl.dev"
  timeout: 30
  max_results: 10

# ── Network / Proxy ──────────────────────────────────────────────────────
network:
  proxy: ""
  no_proxy: "cn,ncbi.nlm.nih.gov,nlm.nih.gov,unpaywall.org,localhost,127.0.0.1"

# ── Model Server GPU Settings ────────────────────────────────────────────
# Kept at top level for model-server compatibility
doc_parse_model_id: ""
embedding_gpu_memory_utilization: 0.35
embedding_max_model_len: 4096
rerank_gpu_memory_utilization: 0.20
doc_parse_gpu_memory_utilization: 0.50
