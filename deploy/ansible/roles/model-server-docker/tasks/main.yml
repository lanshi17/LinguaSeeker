# ── Model Server (Docker Compose — 4 containers) ────────────────────
# Deploys embedding, rerank, VLM, and doc-parse as independent containers.
# Requires: NVIDIA Container Toolkit, Docker, model weights pre-downloaded.

- name: Ensure model weights directory exists
  file:
    path: "{{ model_weights_path | default('/opt/lingua-seeker-data/models') }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

- name: Check NVIDIA Container Toolkit
  command: nvidia-ctk --version
  register: nvidia_ctk
  failed_when: false
  changed_when: false

- name: Fail if NVIDIA Container Toolkit is missing
  fail:
    msg: "NVIDIA Container Toolkit is required for Docker GPU support."
  when: nvidia_ctk.rc != 0

- name: Sync model-server source code
  synchronize:
    src: "{{ playbook_dir }}/../../../services/model-server/"
    dest: "{{ project_root }}/services/model-server/"
    delete: yes
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=logs/"
  notify: Restart model-server-docker

- name: Deploy Docker Compose file
  template:
    src: docker-compose.model-server.yml.j2
    dest: "{{ project_root }}/services/model-server/docker-compose.model-server.yml"
    mode: "0644"
  notify: Restart model-server-docker

- name: Build model server Docker images
  command:
    cmd: docker compose -f docker-compose.model-server.yml build
    chdir: "{{ project_root }}/services/model-server"
  changed_when: false

- name: Start model server containers
  command:
    cmd: docker compose -f docker-compose.model-server.yml up -d
    chdir: "{{ project_root }}/services/model-server"

- name: Wait for embedding server
  uri:
    url: "http://localhost:{{ model_server_embedding_port | default(8002) }}/health"
    method: GET
  register: embed_health
  retries: 30
  delay: 10
  until: embed_health.status == 200
  failed_when: false

- name: Wait for rerank server
  uri:
    url: "http://localhost:{{ model_server_rerank_port | default(8003) }}/health"
    method: GET
  register: rerank_health
  retries: 30
  delay: 10
  until: rerank_health.status == 200
  failed_when: false

- name: Wait for VLM server
  uri:
    url: "http://localhost:{{ model_server_vlm_port | default(8004) }}/health"
    method: GET
  register: vlm_health
  retries: 60
  delay: 10
  until: vlm_health.status == 200
  failed_when: false

- name: Wait for doc-parse server
  uri:
    url: "http://localhost:{{ model_server_doc_parse_port | default(8005) }}/health"
    method: GET
  register: doc_health
  retries: 60
  delay: 10
  until: doc_health.status == 200
  failed_when: false
